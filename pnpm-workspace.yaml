minimumReleaseAgeExclude:
  # Already locked before the pnpm 11 migration; registry integrity matches.
  - zod@4.6.5
  # Exact releases selected by Expo's SDK 57 patch alignment.
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - expo-image-picker@57.0.18

nodeLinker: hoisted
autoInstallPeers: true

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

trustPolicy: no-downgrade

# Expo/Babel uses this existing release; registry integrity matches the lockfile.
trustPolicyExclude:
  - semver@6.3.1
  # Existing transitive release; registry integrity matches the reviewed lockfile.
  - ua-parser-js@1.0.41

overrides:
  # GHSA-p498-v437-472g; compatible with ESLint's ^0.16.6 dependency.
  '@humanfs/node@<0.16.8': 0.16.8
  # Motion's animation entrypoints do not import NativeWind; styling uses Uniwind.
  # Remove this version-specific correction when upstream fixes the peer.
  '@legendapp/motion@2.5.3>nativewind': '-'
  '@tootallnate/once@2.0.0': 2.0.1
  '@xmldom/xmldom': 0.8.15
  ajv@8.17.1: 8.20.0
  baseline-browser-mapping@<2.11.0: 2.11.0
  brace-expansion@1.1.12: 1.1.18
  brace-expansion@2.0.2: 2.1.4
  browserslist@<4.28.7: 4.28.7
  decode-uri-component@<=0.4.2: 0.5.0
  fast-uri@>=3.0.0 <3.1.6: 3.1.6
  flatted: 3.4.4
  follow-redirects@1.15.11: 1.16.0
  js-yaml@3.14.2: 3.15.2
  js-yaml@4.1.1: 4.3.2
  linkify-it: 5.0.2
  lodash@4.17.21: 4.18.1
  markdown-it: 14.2.0
  minimatch@3.1.2: 3.1.4
  minimatch@3.1.3: 3.1.4
  minimatch@8.0.4: 8.0.7
  minimatch@9.0.5: 9.0.9
  nanoid: 3.3.18
  node-forge@1.3.3: 1.4.0
  picomatch@2.3.1: 2.3.2
  picomatch@4.0.3: 4.0.5
  shell-quote@1.8.3: 1.10.0
  tmp@0.0.33: 0.2.7
  uuid@7.0.3: 11.1.1
  ws@7.5.10: 7.5.13
  ws@8.19.0: 8.21.1
  yaml@2.8.2: 2.9.0

patchedDependencies:
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  uniwind@1.2.4: patches/uniwind@1.2.4.patch
