# Already locked before the pnpm 11 migration; registry integrity matches.
minimumReleaseAgeExclude:
  - zod@4.6.5

nodeLinker: hoisted
autoInstallPeers: true

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

trustPolicy: no-downgrade

# Expo/Babel uses this existing release; registry integrity matches the lockfile.
