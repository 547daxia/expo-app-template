# 🔗 Links:
# Related documentation: documentation/quality/testing.md
# Composite actions docs: https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

# ✍️ Description:
# This is a composite action, which means it can be used in other actions.
# This action is used to set up the JDK environment and generate an Android APK for testing.
# This action accepts one input: `APP_ENV`, which is used to generate an APK for a specific environment (development, preview, production). We use preview by default.
# Before generating the APK, we run a pre-build script to generate the necessary native folders based on the selected Expo environment.
# On success, the APK is generated at `./android/app/build/outputs/apk/release/app-release.apk`.

# 👀 Example usage:
#       - name : 📦 Set Up JDK + Generate Test APK
#         uses: ./.github/actions/setup-jdk-generate-apk
#         with:
#           APP_ENV: 'preview'

name: 'Setup  JDK + GRADLE + Generate APK'
description: 'Setup  JDK + GRADLE + Generate APK'
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, preview, production'
    required: true
    default: preview
  API_URL:
    description: 'Client-visible API URL used while evaluating the Expo config'
    required: false
    default: https://dummyjson.com

runs:
  using: composite
  steps:
    - name: Set Up JDK
      uses: actions/setup-java@v5
      with:
        distribution: zulu # See 'Supported distributions' for available options
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Generate Test APK
      run: |
        pnpm prebuild:${{ inputs.APP_ENV }}
        cd  android
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon
        cd ..
      shell: bash
      env:
        EXPO_NO_DOTENV: '1'
        EXPO_PUBLIC_APP_ENV: ${{ inputs.APP_ENV }}
        EXPO_PUBLIC_API_URL: ${{ inputs.API_URL }}
        CI: 'true'
