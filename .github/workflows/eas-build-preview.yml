# 🔗 Links:
# Source file: https://github.com/547daxia/expo-app-template/blob/master/.github/workflows/eas-build-preview.yml
# Related documentation: documentation/operations/release.md

# ✍️ Description:
# This workflow triggers an Android build on EAS for the preview environment.
# It will run on every GitHub release published on the repo or can be triggered manually from the actions tab.
# iOS remains disabled until preview signing credentials are configured.

# 🚨 GITHUB SECRETS REQUIRED:
#         - EXPO_TOKEN: Expo token to authenticate with EAS
#         - You can get it from https://expo.dev/settings/access-tokens

name: EAS Preview Build (Android)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  Build:
    name: EAS Preview Build (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi
      - name: 📦 Checkout project repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ⏱️ EAS Build
        uses: ./.github/actions/eas-build
        with:
          APP_ENV: preview
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
          IOS: false # Enable after configuring iOS credentials for this project.
