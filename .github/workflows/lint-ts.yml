# 🔗 Links:
# Source file: https://github.com/547daxia/expo-app-template/blob/master/.github/workflows/lint-ts.yml

# ✍️ Description:
# This action is used to run eslint checks
# Runs on pull requests and pushes to  the main/master branches
# Based on the event type:
#   - On pull requests, Reviewdog runs ESLint, annotates findings, and fails on errors.
#   - On pushes to main/master, the repository ESLint script runs directly.

# 🚨 GITHUB SECRETS REQUIRED: NONE

name: Lint TS (ESLint)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint TS (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🏃‍♂️ Run ESLint
        if: github.event_name != 'pull_request'
        run: pnpm run lint

      - name: 📝 Annotate ESLint findings on PR
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          eslint_flags: '. --ext .js,.jsx,.ts,.tsx'
