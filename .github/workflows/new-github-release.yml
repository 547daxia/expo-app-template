# 🔗 Links:
# Source file: https://github.com/547daxia/expo-app-template/blob/master/.github/workflows/new-github-release.yml
# Related documentation: documentation/operations/release.md

# ✍️ Description:
# This workflow runs the required quality checks for a version tag before creating
# the corresponding GitHub release with generated release notes.

# 🚨 GITHUB SECRETS REQUIRED: None

name: New GitHub Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: New GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🏷️ Verify tag matches app version
        run: node scripts/check-release-tag.js

      - name: 🔎 Type check
        run: pnpm run type-check

      - name: ✨ Lint
        run: pnpm run lint

      - name: 🧪 Run tests
        run: pnpm run test:ci

      - name: 📐 Check Expo dependency alignment
        run: pnpm exec expo install --check

      - name: 🏗️ Validate Expo native configuration
        run: pnpm exec expo prebuild --no-install
        env:
          EXPO_PUBLIC_APP_ENV: development
          STRICT_ENV_VALIDATION: '1'
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_URL: https://dummyjson.com

      - name: 🔐 Audit production dependencies
        run: pnpm run audit:ci

      - name: 🚑 Expo Doctor
        run: pnpm run doctor

      - name: 📚 Build documentation
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm docs:check
          pnpm --dir docs build

      - name: 🚀 Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          draft: false
