name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: This issue is stale because it has been open 60 days with no activity. Remove the stale label or comment or it will be closed in 14 days
          stale-pr-message: This PR is stale because it has been open 60 days with no activity. Remove the stale label or comment or it will be closed in 14 days
          stale-issue-label: no-issue-activity
          stale-pr-label: no-pr-activity
          days-before-stale: 60
          days-before-close: 14
